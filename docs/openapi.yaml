openapi: 3.0.3
info:
  title: AuthKit API
  version: 0.1.0-rc.1
  description: Static integration contract. Runtime documentation endpoints are intentionally disabled.
servers:
  - url: https://auth.example.com
security:
  - bearerAuth: []
paths:
  /.well-known/openid-configuration:
    get: {security: [], responses: {'200': {$ref: '#/components/responses/OidcDiscovery'}}}
  /.well-known/jwks.json:
    get: {security: [], responses: {'200': {$ref: '#/components/responses/Jwks'}}}
  /api/v1/auth/login:
    post:
      security: []
      requestBody: {$ref: '#/components/requestBodies/Login'}
      responses: {'200': {$ref: '#/components/responses/Login'}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/mfa/verify-login:
    post:
      security: []
      requestBody: {$ref: '#/components/requestBodies/MfaLoginVerification'}
      responses: {'200': {$ref: '#/components/responses/Login'}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/passkeys/options:
    post:
      security: []
      requestBody: {$ref: '#/components/requestBodies/PasskeyAssertionOptions'}
      responses: {'200': {$ref: '#/components/responses/PasskeyAssertionOptions'}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/passkeys/verify:
    post:
      security: []
      requestBody: {$ref: '#/components/requestBodies/PasskeyAssertionFinish'}
      responses: {'200': {$ref: '#/components/responses/Login'}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/refresh:
    post:
      security: [{refreshCookie: [], csrfHeader: []}]
      responses: {'200': {$ref: '#/components/responses/Login'}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/logout:
    post:
      security: [{refreshCookie: [], csrfHeader: []}]
      responses: {'200': {$ref: '#/components/responses/Message'}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/logout-all:
    post:
      requestBody: {$ref: '#/components/requestBodies/MfaOptionalVerification'}
      responses: {'200': {$ref: '#/components/responses/Message'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/register:
    post:
      security: []
      requestBody: {$ref: '#/components/requestBodies/Register'}
      responses: {'201': {$ref: '#/components/responses/Register'}, '202': {$ref: '#/components/responses/RegistrationAccepted'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/email-confirmation/confirm:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailConfirmationConfirmRequest'}
      responses: {'200': {$ref: '#/components/responses/Message'}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/email-confirmation/resend:
    post:
      security: []
      requestBody: {$ref: '#/components/requestBodies/EmailConfirmationResend'}
      responses: {'200': {$ref: '#/components/responses/Message'}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/email-change/confirm:
    post:
      security: []
      requestBody: {$ref: '#/components/requestBodies/EmailChangeConfirm'}
      responses: {'200': {$ref: '#/components/responses/Message'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/password-recovery/request:
    post:
      security: []
      requestBody: {$ref: '#/components/requestBodies/PasswordRecovery'}
      responses: {'200': {$ref: '#/components/responses/Message'}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/password-recovery/reset:
    post:
      security: []
      parameters:
        - {name: email, in: query, required: true, schema: {type: string, format: email, maxLength: 255}}
      requestBody: {$ref: '#/components/requestBodies/PasswordReset'}
      responses: {'200': {$ref: '#/components/responses/Message'}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/social/{providerKey}/start:
    post:
      security: []
      parameters: [{$ref: '#/components/parameters/ProviderKey'}]
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/SocialLoginStartRequest'}}}
      responses: {'200': {$ref: '#/components/responses/SocialAuthorization'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/social/{providerKey}/callback:
    get:
      security: []
      parameters:
        - {$ref: '#/components/parameters/ProviderKey'}
        - {name: state, in: query, required: true, schema: {type: string, minLength: 32, maxLength: 256}}
        - {name: code, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
      responses: {'200': {$ref: '#/components/responses/SocialCallback'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me:
    get:
      responses: {'200': {$ref: '#/components/responses/Profile'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
    patch:
      requestBody: {$ref: '#/components/requestBodies/ProfileUpdate'}
      responses: {'200': {$ref: '#/components/responses/Profile'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
    delete:
      requestBody: {$ref: '#/components/requestBodies/StepUp'}
      responses: {'200': {$ref: '#/components/responses/AccountDeletion'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/consent:
    get:
      responses: {'200': {$ref: '#/components/responses/ConsentSnapshot'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/export:
    post:
      requestBody: {$ref: '#/components/requestBodies/StepUp'}
      responses: {'200': {$ref: '#/components/responses/UserDataExport'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/password:
    post:
      requestBody: {$ref: '#/components/requestBodies/PasswordChange'}
      responses: {'200': {$ref: '#/components/responses/Message'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/email-change:
    post:
      requestBody: {$ref: '#/components/requestBodies/EmailChange'}
      responses: {'200': {$ref: '#/components/responses/EmailChangeStatus'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
    delete:
      requestBody: {$ref: '#/components/requestBodies/StepUp'}
      responses: {'200': {$ref: '#/components/responses/EmailChangeStatus'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/sessions:
    get:
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, schema: {type: string}, description: Opaque single-use cursor with a five-minute lifetime}
      responses:
        '200':
          description: Bounded active-session page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionPageApiResponse'}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/users/me/sessions/{sessionId}:
    delete:
      parameters: [{$ref: '#/components/parameters/SessionId'}]
      requestBody: {$ref: '#/components/requestBodies/MfaOptionalVerification'}
      responses: {'200': {$ref: '#/components/responses/Message'}}
  /api/v1/internal/tokens/introspect:
    post:
      description: Authenticated live introspection for first-party access tokens. Requires the trusted-origin worker credential.
      security: [{workerToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FirstPartyIntrospectionRequest'}
      responses:
        '200':
          description: Live first-party token state
          content: {application/json: {schema: {$ref: '#/components/schemas/FirstPartyIntrospectionApiResponse'}}}
  /api/v1/users/me/mfa:
    get:
      responses: {'200': {$ref: '#/components/responses/MfaStatus'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/mfa/totp/enroll:
    post:
      requestBody: {$ref: '#/components/requestBodies/StepUp'}
      responses: {'200': {$ref: '#/components/responses/MfaTotpEnrollment'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/mfa/totp/confirm:
    post:
      requestBody: {$ref: '#/components/requestBodies/MfaTotpConfirm'}
      responses: {'200': {$ref: '#/components/responses/MfaBackupCodes'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/mfa/totp:
    delete:
      requestBody: {$ref: '#/components/requestBodies/MfaVerification'}
      responses: {'200': {$ref: '#/components/responses/Message'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/mfa/backup-codes:
    post:
      requestBody: {$ref: '#/components/requestBodies/MfaVerification'}
      responses: {'200': {$ref: '#/components/responses/MfaBackupCodes'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/passkeys:
    get:
      responses: {'200': {$ref: '#/components/responses/PasskeyCredentialList'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
    post:
      requestBody: {$ref: '#/components/requestBodies/PasskeyRegistrationFinish'}
      responses: {'200': {$ref: '#/components/responses/PasskeyCredential'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/passkeys/options:
    post:
      requestBody: {$ref: '#/components/requestBodies/StepUpOptional'}
      responses: {'200': {$ref: '#/components/responses/PasskeyRegistrationOptions'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/passkeys/{credentialId}:
    delete:
      parameters: [{$ref: '#/components/parameters/CredentialId'}]
      requestBody: {$ref: '#/components/requestBodies/StepUpOptional'}
      responses: {'200': {$ref: '#/components/responses/Message'}}
  /api/v1/users/me/social-identities:
    get:
      responses: {'200': {$ref: '#/components/responses/SocialIdentityList'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/social-identities/{providerKey}/link/start:
    post:
      parameters: [{$ref: '#/components/parameters/ProviderKey'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/StepUpRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/SocialAuthorization'}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/social-identities/{identityId}:
    delete:
      parameters: [{$ref: '#/components/parameters/IdentityId'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/StepUpRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Message'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/oauth2/authorize:
    description: Deprecated JSON compatibility endpoint. New clients use the conventional browser endpoint below.
    post:
      requestBody: {$ref: '#/components/requestBodies/OAuthAuthorize'}
      responses: {'200': {$ref: '#/components/responses/OAuthAuthorize'}, '400': {$ref: '#/components/responses/Error'}}
  /oauth2/authorize:
    get:
      security: []
      description: Starts an Authorization Code flow and redirects to the operator login/consent UI with an opaque signed transaction handle.
      parameters:
        - {name: response_type, in: query, required: true, schema: {type: string, enum: [code]}}
        - {name: client_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: redirect_uri, in: query, required: true, schema: {type: string, format: uri, maxLength: 512}}
        - {name: scope, in: query, required: true, schema: {type: string, minLength: 1}}
        - {name: state, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 255}}
        - {name: code_challenge, in: query, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{43,128}$'}}
        - {name: code_challenge_method, in: query, required: true, schema: {type: string, enum: [S256]}}
        - {name: nonce, in: query, required: false, schema: {type: string, maxLength: 255}, description: Required when scope contains openid}
      responses:
        '302': {description: 'Redirect to the operator UI, or a validated client redirect carrying a standard OAuth error', headers: {Location: {schema: {type: string, format: uri}}}}
        '400': {$ref: '#/components/responses/OAuthError'}
  /api/v1/oauth2/authorize/transactions/{transaction}:
    parameters:
      - {name: transaction, in: path, required: true, schema: {type: string, minLength: 32, maxLength: 512}}
    get:
      responses:
        '200': {description: Login and consent transaction details, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthAuthorizationTransactionApiResponse'}}}}
        '400': {$ref: '#/components/responses/OAuthError'}
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OAuthAuthorizationDecisionRequest'}}}
      responses:
        '302': {description: Exact registered client redirect with code/state or access_denied/state, headers: {Location: {schema: {type: string, format: uri}}}}
        '400': {$ref: '#/components/responses/OAuthError'}
  /oauth2/token:
    post:
      security: [{oauthClientBasic: []}]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/OAuthTokenRequest'}
      responses:
        '200': {description: Standard OAuth token response, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthTokenResponse'}}}}
        '400': {$ref: '#/components/responses/OAuthError'}
        '401': {$ref: '#/components/responses/OAuthError'}
        '503': {$ref: '#/components/responses/OAuthError'}
  /oauth2/revoke:
    post:
      security: [{oauthClientBasic: []}]
      requestBody: {$ref: '#/components/requestBodies/OAuthRevocation'}
      responses: {'200': {description: Token revoked or already inactive; intentionally no response body}, '400': {$ref: '#/components/responses/OAuthError'}, '401': {$ref: '#/components/responses/OAuthError'}, '503': {$ref: '#/components/responses/OAuthError'}}
  /oauth2/introspect:
    post:
      security: [{oauthClientBasic: []}]
      requestBody: {$ref: '#/components/requestBodies/OAuthIntrospection'}
      responses: {'200': {description: Standard OAuth introspection response, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthIntrospectionResponse'}}}}, '400': {$ref: '#/components/responses/OAuthError'}, '401': {$ref: '#/components/responses/OAuthError'}, '503': {$ref: '#/components/responses/OAuthError'}}
  /oauth2/userinfo:
    get:
      security: [{oauthAccessBearer: []}]
      description: Requires an AuthKit OAuth access token with `token_use=oauth_access`; ID tokens and first-party access tokens are rejected.
      responses: {'200': {$ref: '#/components/responses/OidcUserInfo'}, '400': {$ref: '#/components/responses/OAuthError'}, '401': {$ref: '#/components/responses/OAuthError'}, '503': {$ref: '#/components/responses/OAuthError'}}
  /api/v1/admin/users:
    get:
      parameters:
        - {name: search, in: query, required: false, schema: {type: string, maxLength: 255}, description: Case-insensitive email or display-name search}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 1024}, description: Signed short-lived cursor bound to search and limit}
      responses: {'200': {$ref: '#/components/responses/AdminUserPage'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/users/{userId}:
    get:
      parameters: [{$ref: '#/components/parameters/UserId'}]
      description: Safe account and authenticator status; no password hashes, provider subjects, credential IDs, public keys, or MFA secrets are returned.
      responses: {'200': {$ref: '#/components/responses/AdminUserDetail'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/users/{userId}/sessions/revoke:
    post:
      parameters: [{$ref: '#/components/parameters/UserId'}]
      description: Revokes every AuthKit session for the target after recent local administrator step-up.
      requestBody: {$ref: '#/components/requestBodies/MfaOptionalVerificationRequired'}
      responses: {'200': {$ref: '#/components/responses/Message'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/users/{userId}/role:
    patch:
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody: {$ref: '#/components/requestBodies/AdminUpdateRole'}
      responses: {'200': {$ref: '#/components/responses/AdminUser'}}
  /api/v1/admin/users/{userId}/suspension:
    post:
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody: {$ref: '#/components/requestBodies/AdminAccountState'}
      responses: {'200': {$ref: '#/components/responses/AdminUser'}}
    delete:
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody: {$ref: '#/components/requestBodies/AdminAccountState'}
      responses: {'200': {$ref: '#/components/responses/AdminUser'}}
  /api/v1/admin/users/{userId}/deletion:
    delete:
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody: {$ref: '#/components/requestBodies/AdminAccountState'}
      responses: {'200': {$ref: '#/components/responses/AdminUser'}}
  /api/v1/admin/oauth-clients:
    get:
      responses: {'200': {$ref: '#/components/responses/AdminOAuthClientList'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
    post:
      requestBody: {$ref: '#/components/requestBodies/AdminOAuthClientCreate'}
      responses: {'200': {$ref: '#/components/responses/AdminOAuthClient'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/oauth-clients/{clientId}:
    patch:
      parameters: [{$ref: '#/components/parameters/ClientId'}]
      requestBody: {$ref: '#/components/requestBodies/AdminOAuthClientUpdate'}
      responses: {'200': {$ref: '#/components/responses/AdminOAuthClient'}}
    delete:
      parameters: [{$ref: '#/components/parameters/ClientId'}]
      requestBody: {$ref: '#/components/requestBodies/MfaOptionalVerification'}
      responses: {'200': {$ref: '#/components/responses/Message'}}
  /api/v1/admin/social-providers:
    get:
      responses: {'200': {$ref: '#/components/responses/AdminSocialProviderList'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
    post:
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AdminSocialProviderCreateRequest'}}}
      responses: {'200': {$ref: '#/components/responses/AdminSocialProvider'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/social-providers/{providerId}:
    patch:
      parameters: [{$ref: '#/components/parameters/ProviderId'}]
      requestBody: {$ref: '#/components/requestBodies/AdminSocialProviderUpdate'}
      responses: {'200': {$ref: '#/components/responses/AdminSocialProvider'}}
    delete:
      parameters: [{$ref: '#/components/parameters/ProviderId'}]
      requestBody: {$ref: '#/components/requestBodies/MfaOptionalVerificationRequired'}
      responses: {'200': {$ref: '#/components/responses/Message'}}
  /api/v1/admin/security-events:
    get:
      parameters:
        - {name: userId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 1024}}
      description: Privacy-minimized security-event view with masked network and identity fields.
      responses: {'200': {$ref: '#/components/responses/AdminSecurityEventPage'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/operations:
    get:
      description: Non-secret operational posture and provider-acceptance outbox counts.
      responses: {'200': {$ref: '#/components/responses/AdminOperationalStatus'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: First-party AuthKit access token with `token_use=first_party_access`, configured API audience, non-revoked key, and active server-side session. OAuth access tokens and ID tokens are rejected.
    oauthAccessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth access token with `token_use=oauth_access`, OAuth client audience, `client_id`, and server-side scope checks. ID tokens and first-party access tokens are rejected.
    refreshCookie:
      type: apiKey
      in: cookie
      name: Refresh-Token
      description: HttpOnly refresh cookie scoped to AuthKit refresh/logout routes.
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: CSRF header that must echo the readable CSRF cookie on refresh and logout.
    oauthClientBasic:
      type: http
      scheme: basic
      description: OAuth client authentication for token, introspection, and revocation endpoints. Public clients may use approved body credentials where supported.
    workerToken:
      type: apiKey
      in: header
      name: X-Worker-Token
      description: Rotatable internal credential accepted only from explicitly trusted network peers.
  parameters:
    SessionId: {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
    UserId: {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    ClientId: {name: clientId, in: path, required: true, schema: {type: string}}
    CredentialId: {name: credentialId, in: path, required: true, schema: {type: string, format: uuid}}
    ProviderKey: {name: providerKey, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'}}
    ProviderId: {name: providerId, in: path, required: true, schema: {type: string, format: uuid}}
    IdentityId: {name: identityId, in: path, required: true, schema: {type: string, format: uuid}}
  requestBodies:
    Login: &requiredLoginBody {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
    MfaLoginVerification: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MfaLoginVerificationRequest'}}}}
    PasskeyAssertionOptions: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/PasskeyAssertionOptionsRequest'}}}}
    PasskeyAssertionFinish: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasskeyAssertionFinishRequest'}}}}
    Register: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}}
    EmailConfirmationResend: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmailConfirmationResendRequest'}}}}
    EmailChangeConfirm: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmailChangeConfirmRequest'}}}}
    PasswordRecovery: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordRecoveryRequest'}}}}
    PasswordReset: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordResetRequest'}}}}
    ProfileUpdate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}}}}
    StepUp: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StepUpRequest'}}}}
    StepUpOptional: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/StepUpRequest'}}}}
    MfaOptionalVerification: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/MfaOptionalVerificationRequest'}}}}
    MfaOptionalVerificationRequired: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MfaOptionalVerificationRequest'}}}}
    PasswordChange: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordChangeRequest'}}}}
    EmailChange: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EmailChangeRequest'}}}}
    MfaTotpConfirm: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MfaTotpConfirmRequest'}}}}
    MfaVerification: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MfaVerificationRequest'}}}}
    PasskeyRegistrationFinish: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasskeyRegistrationFinishRequest'}}}}
    OAuthAuthorize: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthAuthorizeRequest'}}}}
    OAuthIntrospection: {required: true, content: {application/x-www-form-urlencoded: {schema: {$ref: '#/components/schemas/OAuthIntrospectionRequest'}}}}
    OAuthRevocation: {required: true, content: {application/x-www-form-urlencoded: {schema: {$ref: '#/components/schemas/OAuthRevocationRequest'}}}}
    AdminUpdateRole: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUpdateRoleRequest'}}}}
    AdminAccountState: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminAccountStateRequest'}}}}
    AdminOAuthClientCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOAuthClientCreateRequest'}}}}
    AdminOAuthClientUpdate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOAuthClientUpdateRequest'}}}}
    AdminSocialProviderUpdate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSocialProviderUpdateRequest'}}}}
  headers:
    XRequestId:
      required: true
      schema: {type: string, format: uuid}
      description: Request correlation identifier; a valid inbound X-Request-ID is preserved, otherwise AuthKit generates one.
  responses:
    Error:
      description: Opaque error response
      headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}
    OAuthError:
      description: Standard OAuth protocol error; never wrapped in the AuthKit envelope
      headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/OAuthError'}}}
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After: {required: true, schema: {type: integer, minimum: 1}, description: Seconds before retrying}
        X-Request-ID: {$ref: '#/components/headers/XRequestId'}
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}
    UserDataExport:
      description: Versioned data-subject export; credential and provider secrets are omitted
      headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}
      content: {application/json: {schema: {$ref: '#/components/schemas/UserDataExportApiResponse'}}}
    OidcDiscovery: {description: OIDC discovery metadata, content: {application/json: {schema: {$ref: '#/components/schemas/OidcDiscoveryResponse'}}}}
    Jwks: {description: Public signing keys, content: {application/json: {schema: {$ref: '#/components/schemas/JwksResponse'}}}}
    OidcUserInfo: {description: OIDC UserInfo claims authorized by scopes, content: {application/json: {schema: {$ref: '#/components/schemas/OidcUserInfoResponse'}}}}
    Login: {description: Authentication result, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/LoginApiResponse'}}}}
    PasskeyAssertionOptions: {description: Passkey assertion ceremony options, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/PasskeyAssertionOptionsApiResponse'}}}}
    Message: {description: Successful operation message, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/MessageApiResponse'}}}}
    Register: {description: Account created, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterApiResponse'}}}}
    RegistrationAccepted: {description: Registration accepted without account-enumeration disclosure, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/RegistrationAcceptedApiResponse'}}}}
    SocialAuthorization: {description: 'OIDC authorization URL with server-bound state, nonce and PKCE', headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SocialAuthorizationApiResponse'}}}}
    SocialCallback: {description: Federated authentication or explicit linking result, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SocialCallbackApiResponse'}}}}
    Profile: {description: Current profile, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileApiResponse'}}}}
    AccountDeletion: {description: Account deletion lifecycle state, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AccountDeletionApiResponse'}}}}
    ConsentSnapshot: {description: Current consent snapshot, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ConsentSnapshotApiResponse'}}}}
    EmailChangeStatus: {description: Email-change ceremony state, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/EmailChangeStatusApiResponse'}}}}
    MfaStatus: {description: MFA enrollment state, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/MfaStatusApiResponse'}}}}
    MfaTotpEnrollment: {description: One-time TOTP enrollment material, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/MfaTotpEnrollmentApiResponse'}}}}
    MfaBackupCodes: {description: One-time plaintext backup codes, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/MfaBackupCodesApiResponse'}}}}
    PasskeyCredential: {description: Passkey credential metadata, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/PasskeyCredentialApiResponse'}}}}
    PasskeyCredentialList: {description: Passkey credential metadata list, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/PasskeyCredentialListApiResponse'}}}}
    PasskeyRegistrationOptions: {description: Passkey registration ceremony options, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/PasskeyRegistrationOptionsApiResponse'}}}}
    SocialIdentityList: {description: Linked social identities, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SocialIdentityListApiResponse'}}}}
    OAuthAuthorize: {description: Deprecated JSON authorization-code response, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthAuthorizeApiResponse'}}}}
    AdminUser: {description: Administrative user state, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserApiResponse'}}}}
    AdminUserPage: {description: Bounded administrative user page, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserPageApiResponse'}}}}
    AdminUserDetail: {description: Safe administrative user and authenticator detail, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserDetailApiResponse'}}}}
    AdminOAuthClient: {description: OAuth client metadata and optional one-time secret, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOAuthClientApiResponse'}}}}
    AdminOAuthClientList: {description: OAuth client metadata list, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOAuthClientListApiResponse'}}}}
    AdminSocialProvider: {description: Social provider metadata without secret, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSocialProviderApiResponse'}}}}
    AdminSocialProviderList: {description: Social provider metadata list, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSocialProviderListApiResponse'}}}}
    AdminSecurityEventPage: {description: Privacy-minimized security-event page, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AdminSecurityEventPageApiResponse'}}}}
    AdminOperationalStatus: {description: Non-secret operational posture, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOperationalStatusApiResponse'}}}}
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 255, example: person@example.com}
        password: {type: string, minLength: 1, maxLength: 128, writeOnly: true, example: correct-horse-battery-staple}
    MfaLoginVerificationRequest:
      type: object
      additionalProperties: false
      required: [mfaToken, code]
      properties:
        mfaToken: {type: string, minLength: 1, maxLength: 512, writeOnly: true}
        code: {type: string, minLength: 6, maxLength: 32, writeOnly: true}
    PasskeyAssertionOptionsRequest:
      type: object
      additionalProperties: false
      properties: {email: {type: string, format: email, maxLength: 255}}
    PasskeyAssertionFinishRequest:
      type: object
      additionalProperties: false
      required: [challengeId, credentialJson]
      properties:
        challengeId: {type: string, format: uuid}
        credentialJson: {type: string, minLength: 1, maxLength: 20000, writeOnly: true}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, termsAccepted, privacyPolicyAccepted]
      properties:
        email: {type: string, format: email, maxLength: 255}
        password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
        termsAccepted: {type: boolean, enum: [true]}
        privacyPolicyAccepted: {type: boolean, enum: [true]}
    EmailConfirmationResendRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties: {email: {type: string, format: email, maxLength: 255}}
    EmailChangeConfirmRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties: {token: {type: string, minLength: 1, maxLength: 512, writeOnly: true}}
    PasswordRecoveryRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties: {email: {type: string, format: email, maxLength: 255}}
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token: {type: string, minLength: 1, maxLength: 512, writeOnly: true}
        newPassword: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties: {name: {type: string, maxLength: 100, nullable: true}}
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        currentPassword: {type: string, maxLength: 128, nullable: true, writeOnly: true}
        newPassword: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
        mfaCode: {type: string, minLength: 6, maxLength: 32, nullable: true, writeOnly: true}
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required: [newEmail, currentPassword]
      properties:
        newEmail: {type: string, format: email, maxLength: 255}
        currentPassword: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
        mfaCode: {type: string, minLength: 6, maxLength: 32, nullable: true, writeOnly: true}
    MfaTotpConfirmRequest:
      type: object
      additionalProperties: false
      required: [credentialId, currentPassword, code]
      properties:
        credentialId: {type: string, format: uuid}
        currentPassword: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
        code: {type: string, minLength: 6, maxLength: 8, writeOnly: true}
    MfaVerificationRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, code]
      properties:
        currentPassword: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
        code: {type: string, minLength: 6, maxLength: 32, writeOnly: true}
    PasskeyRegistrationFinishRequest:
      type: object
      additionalProperties: false
      required: [challengeId, label, credentialJson]
      properties:
        challengeId: {type: string, format: uuid}
        label: {type: string, minLength: 1, maxLength: 100}
        credentialJson: {type: string, minLength: 1, maxLength: 20000, writeOnly: true}
    OAuthAuthorizeRequest:
      type: object
      additionalProperties: false
      required: [responseType, clientId, redirectUri, scope, codeChallenge, codeChallengeMethod]
      properties:
        responseType: {type: string, enum: [code]}
        clientId: {type: string, minLength: 1, maxLength: 128}
        redirectUri: {type: string, format: uri, maxLength: 512}
        scope: {type: string, minLength: 1, maxLength: 512}
        state: {type: string, maxLength: 255, nullable: true}
        codeChallenge: {type: string, pattern: '^[A-Za-z0-9_-]{43,128}$'}
        codeChallengeMethod: {type: string, enum: [S256]}
        nonce: {type: string, maxLength: 255, nullable: true}
        consentAccepted: {type: boolean, nullable: true}
    OAuthIntrospectionRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, minLength: 1, maxLength: 8192, writeOnly: true}
        token_type_hint: {type: string, enum: [access_token, refresh_token], nullable: true}
        client_id: {type: string, maxLength: 128, nullable: true}
        client_secret: {type: string, maxLength: 2048, nullable: true, writeOnly: true}
    OAuthRevocationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, minLength: 1, maxLength: 8192, writeOnly: true}
        token_type_hint: {type: string, enum: [access_token, refresh_token], nullable: true}
        client_id: {type: string, maxLength: 128, nullable: true}
        client_secret: {type: string, maxLength: 2048, nullable: true, writeOnly: true}
    OAuthIntrospectionResponse:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active: {type: boolean}
        sub: {type: string, format: uuid}
        client_id: {type: string}
        scope: {type: string}
        token_type: {type: string, enum: [Bearer, refresh_token]}
        exp: {type: integer, format: int64}
        iat: {type: integer, format: int64}
        iss: {type: string, format: uri}
        aud: {type: array, items: {type: string}}
        token_use: {type: string, enum: [oauth_access]}
        jti: {type: string}
    AdminUpdateRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: {type: string, enum: [USER, PLATFORM_ADMIN]}
        currentPassword: {type: string, maxLength: 128, nullable: true, writeOnly: true}
        mfaCode: {type: string, maxLength: 32, nullable: true, writeOnly: true}
    AdminAccountStateRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
        currentPassword: {type: string, maxLength: 128, nullable: true, writeOnly: true}
        mfaCode: {type: string, maxLength: 32, nullable: true, writeOnly: true}
    AdminOAuthClientCreateRequest:
      type: object
      additionalProperties: false
      required: [displayName, publicClient, redirectUris, scopes, requirePkce]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 120}
        publicClient: {type: boolean}
        redirectUris: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string, format: uri, maxLength: 512}}
        scopes: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string, maxLength: 80}}
        requirePkce: {type: boolean}
        currentPassword: {type: string, maxLength: 128, nullable: true, writeOnly: true}
        mfaCode: {type: string, maxLength: 32, nullable: true, writeOnly: true}
    AdminOAuthClientUpdateRequest:
      type: object
      additionalProperties: false
      required: [displayName, redirectUris, scopes, requirePkce, rotateSecret]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 120}
        redirectUris: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string, format: uri, maxLength: 512}}
        scopes: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string, maxLength: 80}}
        requirePkce: {type: boolean}
        rotateSecret: {type: boolean, description: Returns a new secret exactly once for confidential clients}
        currentPassword: {type: string, maxLength: 128, nullable: true, writeOnly: true}
        mfaCode: {type: string, maxLength: 32, nullable: true, writeOnly: true}
    AdminSocialProviderUpdateRequest:
      type: object
      additionalProperties: false
      required: [displayName, clientId, scopes, clientAuthMethod]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 120}
        clientId: {type: string, minLength: 1, maxLength: 255}
        clientSecret: {type: string, maxLength: 2048, nullable: true, writeOnly: true}
        scopes: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {type: string, maxLength: 80}}
        clientAuthMethod: {type: string, enum: [CLIENT_SECRET_BASIC, CLIENT_SECRET_POST]}
        currentPassword: {type: string, maxLength: 128, nullable: true, writeOnly: true}
        mfaCode: {type: string, maxLength: 32, nullable: true, writeOnly: true}
    OAuthError:
      type: object
      additionalProperties: false
      required: [error, error_description]
      properties:
        error: {type: string, enum: [invalid_request, invalid_client, invalid_grant, invalid_token, unsupported_grant_type, unsupported_response_type, invalid_scope, access_denied, temporarily_unavailable]}
        error_description: {type: string}
    OAuthTokenRequest:
      type: object
      additionalProperties: false
      required: [grant_type]
      properties:
        grant_type: {type: string, enum: [authorization_code, refresh_token]}
        code: {type: string}
        redirect_uri: {type: string, format: uri}
        code_verifier: {type: string, pattern: '^[A-Za-z0-9._~-]{43,128}$'}
        refresh_token: {type: string, description: Opaque rotating bearer credential}
        client_id: {type: string}
        client_secret: {type: string, writeOnly: true}
    OAuthTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: {type: string, description: JWT with token_use=oauth_access}
        id_token: {type: string, nullable: true, description: JWT with token_use=id_token}
        refresh_token: {type: string, nullable: true, description: 'Opaque, rotating and family-bound'}
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer, format: int64, minimum: 1}
        scope: {type: string}
    OAuthAuthorizationDecisionRequest:
      type: object
      additionalProperties: false
      required: [approved]
      properties: {approved: {type: boolean}}
    OAuthAuthorizationTransactionApiResponse:
      type: object
      required: [data, timestamp, requestId]
      properties:
        data:
          type: object
          required: [clientId, clientDisplayName, scopes, consentRequired, expiresInSeconds]
          properties:
            clientId: {type: string}
            clientDisplayName: {type: string}
            scopes: {type: array, items: {type: string}}
            consentRequired: {type: boolean}
            expiresInSeconds: {type: integer, format: int64, minimum: 0}
        errors: {type: array, items: {type: string}, nullable: true}
        timestamp: {type: string, format: date-time}
        requestId: {type: string}
    ApiResponse:
      type: object
      additionalProperties: false
      required: [timestamp, requestId]
      properties:
        data: {type: object, nullable: true, additionalProperties: false, description: Error responses do not carry success data}
        errors: {type: array, items: {type: string}, nullable: true}
        timestamp: {type: string, format: date-time}
        code: {type: string, pattern: '^[a-z0-9_]+$', nullable: true, description: Stable machine-readable error code}
        requestId: {type: string, minLength: 1, maxLength: 128}
    UserDataExportApiResponse:
      type: object
      additionalProperties: false
      required: [data, timestamp, requestId]
      properties:
        data: {$ref: '#/components/schemas/UserDataExportResponse'}
        errors: {type: array, items: {type: string}, nullable: true}
        timestamp: {type: string, format: date-time}
        code: {type: string, pattern: '^[a-z0-9_]+$', nullable: true}
        requestId: {type: string, minLength: 1, maxLength: 128}
    UserDataExportResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, generatedAt, profile, consent, consentHistory, oauthConsents, credentials, sessions, deletion, securityEvents]
      properties:
        schemaVersion: {type: string, enum: [authkit-user-data-export/v1]}
        generatedAt: {type: string, format: date-time}
        profile:
          type: object
          additionalProperties: false
          required: [id, email, role, tenantId, emailConfirmed, accountState]
          properties:
            id: {type: string, format: uuid}
            email: {type: string, format: email}
            name: {type: string, nullable: true}
            role: {type: string, enum: [USER, PLATFORM_ADMIN]}
            tenantId: {type: string, format: uuid, description: Opaque per-person partition}
            emailConfirmed: {type: boolean}
            accountState: {type: string, enum: [ACTIVE, SUSPENDED, DELETION_PENDING, ANONYMIZED]}
            suspendedAt: {type: string, format: date-time, nullable: true}
            suspensionReason: {type: string, nullable: true}
            pendingEmail: {type: string, format: email, nullable: true}
            emailChangeRequestedAt: {type: string, format: date-time, nullable: true}
            emailChangeExpiresAt: {type: string, format: date-time, nullable: true}
        consent:
          type: object
          additionalProperties: false
          required: [termsAccepted, privacyPolicyAccepted]
          properties:
            termsAccepted: {type: boolean}
            privacyPolicyAccepted: {type: boolean}
            termsVersion: {type: string, nullable: true}
            privacyPolicyVersion: {type: string, nullable: true}
            consentAcceptedAt: {type: string, format: date-time, nullable: true}
            lawfulBasis: {type: string, nullable: true}
        consentHistory:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [acceptedAt, recordedAt, eventHash]
            properties:
              termsVersion: {type: string, nullable: true}
              privacyPolicyVersion: {type: string, nullable: true}
              lawfulBasis: {type: string, nullable: true}
              acceptedAt: {type: string, format: date-time}
              recordedAt: {type: string, format: date-time}
              eventHash: {type: string, description: Integrity evidence; not a secret}
        oauthConsents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [clientId, scopes, grantedAt]
            properties:
              clientId: {type: string}
              scopes: {type: array, items: {type: string}}
              grantedAt: {type: string, format: date-time}
              revokedAt: {type: string, format: date-time, nullable: true}
        credentials:
          type: object
          additionalProperties: false
          required: [localPasswordConfigured, passwordHistory, totp, passkeys, socialIdentities]
          properties:
            localPasswordConfigured: {type: boolean, description: Boolean only; password hash is never exported}
