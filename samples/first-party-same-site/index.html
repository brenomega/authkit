<!doctype html>
<html lang="en"><meta charset="utf-8"><title>AuthKit same-site flow</title>
<body>
  <p>This security-focused example has no production UI or branding.</p>
  <input id="email" type="email" autocomplete="username" placeholder="email">
  <input id="password" type="password" autocomplete="current-password" placeholder="password">
  <button id="login">Login</button><button id="profile">Profile</button>
  <button id="refresh">Refresh</button><button id="logout">Logout</button>
  <pre id="output"></pre>
  <script type="module" src="app.js"></script>
</body></html>
