# =============================================================================
# AuthKit — Default Application Configuration (Production Profile)
# Sensitive values are injected via environment variables and NEVER committed.
# Reference: DT 3.1.26 (Configuration), DT 3.1.27 (Profiles)
# =============================================================================

spring:
  application:
    name: authkit

  # ---------------------------------------------------------------------------
  # PostgreSQL Datasource (DT 3.1.20)
  # ---------------------------------------------------------------------------
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECT_TIMEOUT_MS:3000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      pool-name: AuthKit-HikariPool

  # ---------------------------------------------------------------------------
  # JPA / Hibernate (DT 3.1.20, DT 3.1.22)
  # Schema is managed exclusively by Flyway — Hibernate must never auto-modify.
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: ${HIBERNATE_JDBC_BATCH_SIZE:20}
        order_inserts: true
        order_updates: true

  # ---------------------------------------------------------------------------
  # Flyway — Database schema migrations (DT 3.1.22)
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true

  # ---------------------------------------------------------------------------
  # Redis — Token storage and rate limiting (DT 3.1.23)
  # ---------------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 200ms

  # ---------------------------------------------------------------------------
  # RabbitMQ — Asynchronous message broker (DT 3.1.15)
  # ---------------------------------------------------------------------------
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}

  # ---------------------------------------------------------------------------
  # Jackson — Strict duplicate detection (DT 3.1.30)
  # ---------------------------------------------------------------------------
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      accept-case-insensitive-properties: false
    parser:
      strict-duplicate-detection: true

resend:
  api:
    key: ${RESEND_API_KEY}

# =============================================================================
# JWT RSA Key Configuration (DT 3.2.2)
# Keys are loaded from external files via environment variables.
# =============================================================================
jwt:
  public:
    key: ${JWT_PUBLIC_KEY}
  private:
    key: ${JWT_PRIVATE_KEY}

# =============================================================================
# Auth Runtime Configuration
# Stateless token, cookie, issuer, and public frontend settings.
# =============================================================================
authkit:
  auth:
    token:
      access-token-ttl-seconds: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
      refresh-token-ttl-days: ${AUTH_REFRESH_TOKEN_TTL_DAYS:7}
      recovery-token-ttl-minutes: ${AUTH_RECOVERY_TOKEN_TTL_MINUTES:15}
    cookie:
      refresh-name: ${AUTH_REFRESH_COOKIE_NAME:Refresh-Token}
      path: ${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
      http-only: ${AUTH_REFRESH_COOKIE_HTTP_ONLY:true}
      secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
      same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Strict}
    csrf:
      enabled: ${AUTH_CSRF_ENABLED:true}
      cookie-name: ${AUTH_CSRF_COOKIE_NAME:XSRF-TOKEN}
      header-name: ${AUTH_CSRF_HEADER_NAME:X-XSRF-TOKEN}
      path: ${AUTH_CSRF_COOKIE_PATH:/api/v1/auth}
      token-bytes: ${AUTH_CSRF_TOKEN_BYTES:32}
    jwt:
      issuer: ${AUTH_JWT_ISSUER}
      audience: ${AUTH_JWT_AUDIENCE}
      key-id: ${AUTH_JWT_KEY_ID:authkit-key-1}
    frontend:
      activation-url: ${AUTH_FRONTEND_ACTIVATION_URL}
      password-reset-url: ${AUTH_FRONTEND_PASSWORD_RESET_URL}
    registration:
      stealth-conflicts: ${AUTH_REGISTRATION_STEALTH_CONFLICTS:true}
    authority-cache:
      ttl-seconds: ${AUTH_AUTHORITY_CACHE_TTL_SECONDS:30}
      max-size: ${AUTH_AUTHORITY_CACHE_MAX_SIZE:10000}
    request:
      max-body-bytes: ${AUTH_MAX_REQUEST_BODY_BYTES:65536}
    email-outbox:
      enabled: ${AUTH_EMAIL_OUTBOX_ENABLED:true}
      batch-size: ${AUTH_EMAIL_OUTBOX_BATCH_SIZE:50}
      poll-delay-ms: ${AUTH_EMAIL_OUTBOX_POLL_DELAY_MS:5000}
      lock-ttl-seconds: ${AUTH_EMAIL_OUTBOX_LOCK_TTL_SECONDS:300}
    compliance:
      terms-version: ${AUTH_TERMS_VERSION}
      privacy-policy-version: ${AUTH_PRIVACY_POLICY_VERSION}
      lawful-basis: ${AUTH_LAWFUL_BASIS:consent}
      security-event-retention-days: ${AUTH_SECURITY_EVENT_RETENTION_DAYS:365}
      deleted-account-retention-days: ${AUTH_DELETED_ACCOUNT_RETENTION_DAYS:30}
      data-export-security-event-limit: ${AUTH_DATA_EXPORT_SECURITY_EVENT_LIMIT:100}
      retention-batch-size: ${AUTH_RETENTION_BATCH_SIZE:500}
      retention-job-enabled: ${AUTH_RETENTION_JOB_ENABLED:true}
      retention-job-cron: '${AUTH_RETENTION_JOB_CRON:0 30 3 * * *}'
    audit:
      hash-pepper: ${AUTH_AUDIT_HASH_PEPPER}
      async-enabled: ${AUTH_AUDIT_ASYNC_ENABLED:true}
      writer-core-pool-size: ${AUTH_AUDIT_WRITER_CORE_POOL_SIZE:2}
      writer-max-pool-size: ${AUTH_AUDIT_WRITER_MAX_POOL_SIZE:4}
      writer-queue-capacity: ${AUTH_AUDIT_WRITER_QUEUE_CAPACITY:5000}
      writer-shutdown-timeout-seconds: ${AUTH_AUDIT_WRITER_SHUTDOWN_TIMEOUT_SECONDS:10}
      persist-synchronously-on-overload: ${AUTH_AUDIT_SYNC_ON_OVERLOAD:true}
    mfa:
      enabled: ${AUTH_MFA_ENABLED:true}
      backup-code-count: ${AUTH_MFA_BACKUP_CODE_COUNT:10}
      login-challenge-ttl-minutes: ${AUTH_MFA_LOGIN_CHALLENGE_TTL_MINUTES:5}
      secret-encryption-key: ${AUTH_MFA_SECRET_ENCRYPTION_KEY}
      secret-encryption-key-id: ${AUTH_MFA_SECRET_ENCRYPTION_KEY_ID:mfa-key-1}
      previous-secret-encryption-keys: ${AUTH_MFA_PREVIOUS_SECRET_ENCRYPTION_KEYS:}
      secret-encryption-kdf-iterations: ${AUTH_MFA_SECRET_ENCRYPTION_KDF_ITERATIONS:210000}
      status-cache-ttl-seconds: ${AUTH_MFA_STATUS_CACHE_TTL_SECONDS:60}
      status-cache-max-size: ${AUTH_MFA_STATUS_CACHE_MAX_SIZE:10000}
    passkey:
      enabled: ${AUTH_PASSKEY_ENABLED:true}
      rp-id: ${AUTH_PASSKEY_RP_ID}
      rp-name: ${AUTH_PASSKEY_RP_NAME:AuthKit}
      origins: ${AUTH_PASSKEY_ORIGINS}
      challenge-ttl-minutes: ${AUTH_PASSKEY_CHALLENGE_TTL_MINUTES:5}
      allow-origin-port: ${AUTH_PASSKEY_ALLOW_ORIGIN_PORT:false}
      allow-origin-subdomain: ${AUTH_PASSKEY_ALLOW_ORIGIN_SUBDOMAIN:false}
    oauth:
      provider-enabled: ${AUTH_OAUTH_PROVIDER_ENABLED:true}
      authorization-code-ttl-minutes: ${AUTH_OAUTH_AUTHORIZATION_CODE_TTL_MINUTES:5}
      id-token-ttl-seconds: ${AUTH_OAUTH_ID_TOKEN_TTL_SECONDS:900}

# =============================================================================
# Server Configuration
# =============================================================================
server:
  port: 8080
  forward-headers-strategy: framework

# =============================================================================
# Security Configuration (Argon2id)
# =============================================================================
security:
  argon2:
    salt-length: 16
    hash-length: 32
    parallelism: ${SECURITY_ARGON2_PARALLELISM:2}
    # Intentionally use 32768 KiB rather than 65536 KiB to balance production
    # login capacity and JVM thread-exhaustion resistance. Iterations stay at
    # the OWASP floor and are guarded by ProductionConfigValidator.
    # This is a calculated trade-off to increase the maximum concurrent login capacity
    # and reduce Thread Exhaustion risks in the JVM, while still maintaining a very high
    # level of security (superior to BCrypt/PBKDF2) against GPU/ASIC brute-forcing.
    memory: ${SECURITY_ARGON2_MEMORY:32768}
    iterations: ${SECURITY_ARGON2_ITERATIONS:2}

# =============================================================================
# Observability / Actuator (DT 3.4.4)
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    enable:
      hikaricp: true
    tags:
      application: authkit

# =============================================================================
# Application Security
# =============================================================================
app:
  security:
    worker-token: ${WORKER_TOKEN}

# =============================================================================
# Rate Limiting — Hybrid Layer Configuration (DT 3.2.21)
# =============================================================================
network:
  security:
    # Trusted origin CIDR ranges — reverse-proxy agnostic (DT 3.2.19)
    # Empty = falls back to Cloudflare defaults. Override for AWS/Nginx/etc.
    trusted-origins:
      ranges: ${NETWORK_SECURITY_TRUSTED_ORIGINS:127.0.0.1/32}
    rate-limit:
      local-capacity: 60       # Layer 1 per-IP per-minute (Caffeine). Kept as a fraction of global (e.g. 1/5 for 5 nodes) to mitigate Outage Limit Amplification during Redis failure.
      global-capacity: 300     # Layer 2 distributed per-minute (Redis)
      local-max-size: 100000   # Max tracked IPs in Caffeine cache
  # Number of trusted reverse proxies for X-Forwarded-For depth (DT 3.2.20)
  proxy-depth: 1
  # IP resolution strategy toggles
  strategy:
    cloudflare:
      enabled: true            # CF-Connecting-IP (highest priority)
    x-forwarded-for:
      enabled: true            # X-Forwarded-For with proxy depth
