# =============================================================================
# AuthKit — Default Application Configuration (Production Profile)
# Sensitive values are injected via environment variables and NEVER committed.
# Reference: DT 3.1.26 (Configuration), DT 3.1.27 (Profiles)
# =============================================================================

spring:
  application:
    name: authkit

  # ---------------------------------------------------------------------------
  # PostgreSQL Datasource (DT 3.1.20)
  # ---------------------------------------------------------------------------
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ---------------------------------------------------------------------------
  # JPA / Hibernate (DT 3.1.20, DT 3.1.22)
  # Schema is managed exclusively by Flyway — Hibernate must never auto-modify.
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ---------------------------------------------------------------------------
  # Flyway — Database schema migrations (DT 3.1.22)
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true

  # ---------------------------------------------------------------------------
  # Redis — Token storage and rate limiting (DT 3.1.23)
  # ---------------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      timeout: 200ms

  # ---------------------------------------------------------------------------
  # RabbitMQ — Asynchronous message broker (DT 3.1.15)
  # ---------------------------------------------------------------------------
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}

  # ---------------------------------------------------------------------------
  # Jackson — Strict duplicate detection (DT 3.1.30)
  # ---------------------------------------------------------------------------
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      accept-case-insensitive-properties: false
    parser:
      strict-duplicate-detection: true

# =============================================================================
# JWT RSA Key Configuration (DT 3.2.2)
# Keys are loaded from external files via environment variables.
# =============================================================================
jwt:
  public:
    key: ${JWT_PUBLIC_KEY}
  private:
    key: ${JWT_PRIVATE_KEY}

# =============================================================================
# Server Configuration
# =============================================================================
server:
  port: 8080

# =============================================================================
# Security Configuration (Argon2id)
# =============================================================================
security:
  argon2:
    salt-length: 16
    hash-length: 32
    parallelism: ${SECURITY_ARGON2_PARALLELISM:2}
    # Intentionally relaxed the memory requirement from 65536 (64MB) to 32768 (32MB)
    # and iterations from 3 to 1 compared to the original DT 3.2.1.
    # This is a calculated trade-off to increase the maximum concurrent login capacity
    # and reduce Thread Exhaustion risks in the JVM, while still maintaining a very high
    # level of security (superior to BCrypt/PBKDF2) against GPU/ASIC brute-forcing.
    memory: ${SECURITY_ARGON2_MEMORY:32768}
    iterations: ${SECURITY_ARGON2_ITERATIONS:1}

# =============================================================================
# Observability / Actuator (DT 3.4.4)
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: authkit

# =============================================================================
# Application Security
# =============================================================================
app:
  security:
    worker-token: ${WORKER_TOKEN}

# =============================================================================
# Rate Limiting — Hybrid Layer Configuration (DT 3.2.21)
# =============================================================================
network:
  security:
    # Trusted origin CIDR ranges — reverse-proxy agnostic (DT 3.2.19)
    # Empty = falls back to Cloudflare defaults. Override for AWS/Nginx/etc.
    trusted-origins:
      ranges: ${NETWORK_SECURITY_TRUSTED_ORIGINS:127.0.0.1/32}
    rate-limit:
      local-capacity: 60       # Layer 1 per-IP per-minute (Caffeine). Kept as a fraction of global (e.g. 1/5 for 5 nodes) to mitigate Outage Limit Amplification during Redis failure.
      global-capacity: 300     # Layer 2 distributed per-minute (Redis)
      local-max-size: 100000   # Max tracked IPs in Caffeine cache
  # Number of trusted reverse proxies for X-Forwarded-For depth (DT 3.2.20)
  proxy-depth: 1
  # IP resolution strategy toggles
  strategy:
    cloudflare:
      enabled: true            # CF-Connecting-IP (highest priority)
    x-forwarded-for:
      enabled: true            # X-Forwarded-For with proxy depth
