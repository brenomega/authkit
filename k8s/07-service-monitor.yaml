apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: authkit
  labels:
    app: authkit
spec:
  # /actuator/prometheus requires X-Worker-Token. If your Prometheus Operator
  # version cannot set custom scrape headers, route this ServiceMonitor through
  # an in-cluster scrape proxy that injects the worker token from authkit-secrets.
  selector:
    matchLabels:
      app: authkit
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
