apiVersion: v1
kind: Secret
metadata:
  name: authkit-secrets
type: Opaque
stringData:
  # ===========================================================================
  # AuthKit — Kubernetes Secrets Template
  # WARNING: NEVER commit actual production secrets to your repository.
  # Use ExternalSecrets, HashiCorp Vault, or AWS Secrets Manager in production.
  # All sensitive fields must be changed from their default CHANGE-ME values.
  # ===========================================================================
  DB_URL: "jdbc:postgresql://postgres:5432/authkit"
  DB_USERNAME: "CHANGE-ME-DB-USER"
  DB_PASSWORD: "CHANGE-ME-DB-PASSWORD"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RABBIT_HOST: "rabbitmq"
  RABBIT_PORT: "5672"
  RABBIT_USERNAME: "CHANGE-ME-RABBIT-USER"
  RABBIT_PASSWORD: "CHANGE-ME-RABBIT-PASSWORD"
  JWT_PUBLIC_KEY: "/etc/authkit/keys/app.pub" 
  JWT_PRIVATE_KEY: "/etc/authkit/keys/app.key"
  WORKER_TOKEN: "CHANGE-ME-SECURE-WORKER-TOKEN"
  RESEND_API_KEY: "CHANGE-ME-RESEND-API-KEY"
