apiVersion: v1
kind: Secret
metadata:
  name: authkit-secrets
type: Opaque
stringData:
  # In a real production environment, these should be populated by a CI/CD pipeline,
  # Vault injection, or ExternalSecrets operator, rather than committed to VCS.
  # These are placeholders for the deployment to start successfully.
  DB_URL: "jdbc:postgresql://postgres:5432/authkit"
  DB_USERNAME: "postgres"
  DB_PASSWORD: "secretpassword"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RABBIT_HOST: "rabbitmq"
  RABBIT_PORT: "5672"
  RABBIT_USERNAME: "guest"
  RABBIT_PASSWORD: "guest"
  JWT_PUBLIC_KEY: "/etc/authkit/keys/app.pub" 
  JWT_PRIVATE_KEY: "/etc/authkit/keys/app.key"
  WORKER_TOKEN: "secure-production-worker-token"
