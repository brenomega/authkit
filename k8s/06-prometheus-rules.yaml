apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: authkit-security-alerts
spec:
  groups:
    - name: authkit.security
      rules:
        - alert: AuthKitFailedLoginSpike
          expr: increase(security_login_failed_total[5m]) > 50
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: AuthKit failed-login spike
            description: Failed login events exceeded the configured investigation threshold.
        - alert: AuthKitAccountLockoutSpike
          expr: increase(security_account_locked_total[10m]) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: AuthKit account lockout spike
            description: Progressive lockout events increased above normal baseline.
        - alert: AuthKitPasswordResetFailures
          expr: increase(security_password_reset_failed_total[10m]) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: AuthKit password reset failures
            description: Password reset token failures may indicate guessing or replay attempts.
        - alert: AuthKitRefreshTokenReuse
          expr: increase(security_refresh_token_reuse_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: AuthKit refresh token reuse detected
            description: Refresh token family reuse indicates possible token theft. Investigate immediately.
        - alert: AuthKitMfaChallengeFailures
          expr: increase(security_mfa_challenge_failed_total[10m]) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: AuthKit MFA challenge failures increased
            description: MFA challenge failures may indicate account takeover attempts, replayed challenges, or authenticator drift.
        - alert: AuthKitMfaLoginFailures
          expr: increase(security_mfa_login_failed_total[10m]) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: AuthKit MFA login failures increased
            description: MFA login failures indicate password-plus-second-factor attack pressure and should be correlated with account lockout events.
        - alert: AuthKitMfaStepUpFailures
          expr: increase(security_mfa_step_up_failed_total[10m]) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: AuthKit MFA step-up failures increased
            description: MFA step-up failures may indicate attempted sensitive-operation abuse from an authenticated session.
        - alert: AuthKitBackupCodeUsage
          expr: increase(security_mfa_backup_code_used_total[10m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: AuthKit MFA backup code used
            description: Backup code usage is high-signal account recovery activity and should be investigated for the affected account.
        - alert: AuthKitRateLimitDrops
          expr: increase(rate_limit_dropped_total[5m]) > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: AuthKit rate-limit drops increased
            description: Application-layer rate limiting is dropping a high volume of requests.
        - alert: AuthKitAbuseControlDegraded
          expr: increase(security_abuse_control_degraded_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: AuthKit abuse controls degraded
            description: Endpoint/account abuse throttles lost distributed Redis enforcement and are running with strict local fallback only.
        - alert: AuthKitEndpointAbuseBlocked
          expr: increase(security_abuse_control_blocked_total[5m]) > 50
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: AuthKit endpoint abuse throttles blocking traffic
            description: High-risk endpoint/account throttles are blocking an elevated volume of requests.
        - alert: AuthKitLockoutDegraded
          expr: increase(security_lockout_degraded_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: AuthKit account lockout degraded
            description: Account lockout lost distributed Redis enforcement and is relying on per-node local state.
        - alert: AuthKitInfrastructureFailure
          expr: increase(security_infrastructure_failure_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: AuthKit dependency failure
            description: Redis, RabbitMQ, or outbox-backed infrastructure reported failures.
        - alert: AuthKitSecurityEventDrops
          expr: increase(security_events_dropped_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: AuthKit security event drops detected
            description: The bounded security-event writer dropped events. Investigate database capacity and abuse volume.
        - alert: AuthKitSecurityEventWriterSaturation
          expr: increase(security_events_overloaded_total[5m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: AuthKit security event writer saturated
            description: The bounded security-event writer queue saturated and used overload handling. Investigate database latency and abuse volume before drops occur.
        - alert: AuthKitWorkerAuthenticationDenied
          expr: increase(security_worker_auth_denied_total[5m]) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Internal worker authentication denied
            description: Repeated network-bound worker authentication failures may indicate probing or configuration drift.
        - alert: AuthKitEmailRetries
          expr: increase(security_email_outbox_retry_total[10m]) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Email delivery retries elevated
            description: Outbox delivery retries are elevated. Check RabbitMQ, provider latency, and credentials.
        - alert: AuthKitEmailDeadMessages
          expr: increase(security_email_outbox_dead_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: Email messages reached terminal DEAD state
            description: Manual investigation and replay decision are required before the provider idempotency window expires.
        - alert: AuthKitArgon2Saturation
          expr: increase(security_argon2_capacity_exceeded_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Argon2 concurrency saturated
            description: Authentication work is being shed to protect JVM capacity.
        - alert: AuthKitAuditDrops
          expr: increase(security_audit_dropped_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: Noncritical audit events dropped
            description: Investigate audit database latency and bounded writer capacity.
        - alert: AuthKitAuditFailClosed
          expr: increase(security_audit_fail_closed_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: Critical operation rolled back by audit failure
            description: Critical audit persistence failed and a protected mutation was denied.
        - alert: AuthKitRedisDegradation
          expr: increase(security_abuse_control_degraded_total[5m]) + increase(security_lockout_degraded_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: Redis-backed security controls degraded
            description: Distributed abuse or lockout state is unavailable.
        - alert: AuthKitSchedulerFailure
          expr: increase(security_scheduler_failure_total[10m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: Scheduled security job failed
            description: Email polling or retention failed and requires investigation.
        - alert: AuthKitHibpDegraded
          expr: increase(security_password_hibp_degraded_total[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Breached-password screening degraded
            description: HIBP checks are failing open; inspect provider reachability and timeout rates.
        - alert: AuthKitAbuseFailClosed
          expr: increase(security_abuse_control_fail_closed_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: High-risk authentication denied during Redis loss
            description: Opt-in fail-closed abuse protection is returning 503 responses.
