apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authkit-ingress-only
spec:
  podSelector:
    matchLabels:
      app: authkit
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          # Assumes the ingress controller is in a namespace labeled kubernetes.io/metadata.name: ingress-nginx
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
