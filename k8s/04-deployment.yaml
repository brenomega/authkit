apiVersion: apps/v1
kind: Deployment
metadata:
  name: authkit
  namespace: authkit
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Unsupported local-only example uses an operator-loaded image; a supported future Kubernetes profile must pin its published OCI digest."
    checkov.io/skip2: "CKV_K8S_15=Never is intentional for the operator-loaded immutable local candidate in this unsupported example."
    checkov.io/skip3: "CKV_K8S_35=The current application contract consumes scalar credentials from environment variables; migration to projected files belongs to a future supported Kubernetes profile."
spec:
  # Unsupported example only. The v0.1 golden path is single-instance Compose.
  replicas: 1
  selector:
    matchLabels:
      app: authkit
  template:
    metadata:
      labels:
        app: authkit
    spec:
      automountServiceAccountToken: false
      # Pod-level security hardening (DT 3.6.4)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authkit
          # Load a locally reviewed candidate image. Never deploy a mutable tag in production.
          image: authkit:local
          imagePullPolicy: Never
          # Container-level security hardening
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: authkit-secrets
            - configMapRef:
                name: authkit-network-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: jwt-keys
              mountPath: /etc/authkit/keys
              readOnly: true
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1024Mi"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: jwt-keys
          secret:
            secretName: authkit-jwt-keys
