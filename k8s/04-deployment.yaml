apiVersion: apps/v1
kind: Deployment
metadata:
  name: authkit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: authkit
  template:
    metadata:
      labels:
        app: authkit
    spec:
      containers:
        - name: authkit
          image: brenomega/authkit:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: authkit-secrets
            - configMapRef:
                name: authkit-network-config
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1024Mi"
