# =============================================================================
# AuthKit — Docker Compose Orchestration
# Services: PostgreSQL, Redis, RabbitMQ, pgAdmin, Backend
#
# Development-only: credentials in this file are intentionally local defaults.
# Production deployments must inject secrets through a secret manager or K8s
# Secret manifests and will be rejected by ProductionConfigValidator if these
# placeholder values are used outside dev/test profiles.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — Main relational database (DT 3.1.20)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: authkit-postgres
    environment:
      POSTGRES_DB: authkit
      POSTGRES_USER: authkit
      POSTGRES_PASSWORD: authkit_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authkit -d authkit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — Token storage and rate limiting cache (DT 3.1.23)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: authkit-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # RabbitMQ — Asynchronous message broker (DT 3.1.15)
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: authkit-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: authkit
      RABBITMQ_DEFAULT_PASS: authkit_secret
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management UI
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # pgAdmin — Database management UI
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: authkit-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@authkit.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Backend — Stateless Spring Boot application (DT 3.1.17, DT 3.2.5)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authkit-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/authkit
      DB_USERNAME: authkit
      DB_PASSWORD: authkit_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USERNAME: authkit
      RABBIT_PASSWORD: authkit_secret
      JWT_PRIVATE_KEY: file:/app/keys/app.key
      JWT_PUBLIC_KEY: file:/app/keys/app.pub
      AUTH_JWT_ISSUER: authkit-local
      AUTH_JWT_AUDIENCE: authkit-local-api
      AUTH_JWT_KEY_ID: authkit-local-key-1
      AUTH_ACCESS_TOKEN_TTL_SECONDS: 900
      AUTH_REFRESH_TOKEN_TTL_DAYS: 7
      AUTH_RECOVERY_TOKEN_TTL_MINUTES: 15
      AUTH_AUTHORITY_CACHE_TTL_SECONDS: 30
      AUTH_AUTHORITY_CACHE_MAX_SIZE: 10000
      AUTH_MAX_REQUEST_BODY_BYTES: 65536
      AUTH_EMAIL_OUTBOX_ENABLED: "true"
      AUTH_EMAIL_OUTBOX_BATCH_SIZE: 50
      AUTH_EMAIL_OUTBOX_POLL_DELAY_MS: 5000
      AUTH_EMAIL_OUTBOX_LOCK_TTL_SECONDS: 300
      AUTH_REFRESH_COOKIE_NAME: Refresh-Token
      AUTH_REFRESH_COOKIE_PATH: /api/v1/auth
      AUTH_REFRESH_COOKIE_HTTP_ONLY: "true"
      AUTH_REFRESH_COOKIE_SECURE: "true"
      AUTH_REFRESH_COOKIE_SAME_SITE: Strict
      AUTH_CSRF_ENABLED: "true"
      AUTH_CSRF_COOKIE_NAME: XSRF-TOKEN
      AUTH_CSRF_HEADER_NAME: X-XSRF-TOKEN
      AUTH_CSRF_COOKIE_PATH: /api/v1/auth
      AUTH_CSRF_TOKEN_BYTES: 32
      AUTH_FRONTEND_ACTIVATION_URL: https://authkit.local/activate
      AUTH_FRONTEND_PASSWORD_RESET_URL: https://authkit.local/reset-password
      AUTH_REGISTRATION_STEALTH_CONFLICTS: "false"
      AUTH_TERMS_VERSION: terms-v1
      AUTH_PRIVACY_POLICY_VERSION: privacy-v1
      AUTH_LAWFUL_BASIS: consent
      AUTH_SECURITY_EVENT_RETENTION_DAYS: 365
      AUTH_DELETED_ACCOUNT_RETENTION_DAYS: 30
      AUTH_DATA_EXPORT_SECURITY_EVENT_LIMIT: 100
      AUTH_RETENTION_BATCH_SIZE: 500
      AUTH_RETENTION_JOB_ENABLED: "true"
      AUTH_RETENTION_JOB_CRON: "0 30 3 * * *"
      AUTH_AUDIT_HASH_PEPPER: local-development-audit-hash-pepper-change-for-prod
      AUTH_AUDIT_ASYNC_ENABLED: "true"
      AUTH_AUDIT_WRITER_CORE_POOL_SIZE: 2
      AUTH_AUDIT_WRITER_MAX_POOL_SIZE: 4
      AUTH_AUDIT_WRITER_QUEUE_CAPACITY: 5000
      AUTH_AUDIT_WRITER_SHUTDOWN_TIMEOUT_SECONDS: 10
      AUTH_AUDIT_SYNC_ON_OVERLOAD: "true"
      AUTH_MFA_ENABLED: "true"
      AUTH_MFA_BACKUP_CODE_COUNT: 10
      AUTH_MFA_LOGIN_CHALLENGE_TTL_MINUTES: 5
      AUTH_MFA_SECRET_ENCRYPTION_KEY: local-development-mfa-secret-key-change-for-prod
      AUTH_PASSKEY_ENABLED: "true"
      AUTH_PASSKEY_RP_ID: localhost
      AUTH_PASSKEY_RP_NAME: AuthKit Local
      AUTH_PASSKEY_ORIGINS: http://localhost:8080,http://localhost:3000
      AUTH_PASSKEY_CHALLENGE_TTL_MINUTES: 5
      AUTH_PASSKEY_ALLOW_ORIGIN_PORT: "true"
      AUTH_PASSKEY_ALLOW_ORIGIN_SUBDOMAIN: "false"
      AUTH_OAUTH_PROVIDER_ENABLED: "true"
      AUTH_OAUTH_AUTHORIZATION_CODE_TTL_MINUTES: 5
      AUTH_OAUTH_ID_TOKEN_TTL_SECONDS: 900
      WORKER_TOKEN: local-development-worker-token
      RESEND_API_KEY: re_local_development_token
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  rabbitdata:
