name: authkit-manual-proof

services:
  postgres:
    image: postgres:17-alpine@sha256:778d0b486d6daa02b77434d0358ec57a1b21fd8b6d22ac2eef56a33e816928f6
    environment:
      POSTGRES_DB: authkit
      POSTGRES_USER: authkit
      POSTGRES_PASSWORD: local-proof-postgres-password
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authkit -d authkit"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data:size=256m

  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "local-proof-redis-password"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=local-proof-redis-password redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18026:8025"
