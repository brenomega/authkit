# =============================================================================
# AuthKit — Continuous Integration Workflow (DT 3.1.19)
#
# Triggers: push to main/develop, pull requests to main
# Steps:
#   1. Checkout the source code
#   2. Set up Java 21 (Eclipse Temurin) with Maven caching
#   3. Run all unit and integration tests using the 'test' profile
#
# The build fails automatically if any test fails (Maven default behavior).
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

# Environment: Force Node.js 24 runtime to avoid Node.js 20 deprecation.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Step 2: Set up Java 21 with Maven dependency caching
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3: Run all tests with the 'test' profile (H2 in-memory DB)
      # The build will fail if any test fails (DT 3.1.19).
      - name: Run tests
        run: mvn clean verify -Dspring.profiles.active=test -B

      - name: Upload CycloneDX SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authkit-sbom-${{ github.sha }}
          path: |
            target/bom.json
            target/bom.xml
          if-no-files-found: error
          retention-days: 30

      - name: Scan dependency manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Build container image for scanning
        run: docker build -t authkit:${{ github.sha }} .

      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: authkit:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  postgres-migration:
    name: PostgreSQL Flyway Migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run PostgreSQL migration test
        run: mvn -Dspring.profiles.active=test -Dtest=io.github.brenomega.authkit.infrastructure.persistence.PostgresMigrationTest test -B
